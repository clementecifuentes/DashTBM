<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBM Dealer Analysis</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface-2:#fafaf7;
  --surface-3:#f0f0ec;
  --line:#e5e4de;
  --line-2:#cfcec6;
  --ink:#15150f;
  --ink-2:#57574e;
  --ink-3:#8a8a80;
  --accent:#2f6f28;
  --accent-soft:#e8f0e4;
  --up:#0a7a0a;   --up-fill:#0ca30c;
  --down:#a92c2c; --down-fill:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --r:12px;
  --shadow:0 1px 2px rgba(20,20,15,.05), 0 1px 12px rgba(20,20,15,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111210;
    --surface:#1a1c19;
    --surface-2:#1f221e;
    --surface-3:#262a24;
    --line:#2e322c;
    --line-2:#434840;
    --ink:#eef0ea;
    --ink-2:#b0b3a9;
    --ink-3:#83877c;
    --accent:#7fc464;
    --accent-soft:#22301d;
    --up:#4ec94e;   --up-fill:#0ca30c;
    --down:#f08080; --down-fill:#d03b3b;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 1px 12px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,
    Inter,system-ui,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1320px;margin:0 auto;padding:22px 22px 72px}

/* ---------- encabezado ---------- */
.top{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;
  padding-bottom:18px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:center;gap:12px}
.marca .barra{width:4px;height:42px;border-radius:2px;background:var(--accent)}
h1{margin:0;font-size:1.4rem;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--ink-2);font-size:.83rem;margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:.72rem;font-weight:600;
  background:var(--accent-soft);color:var(--accent);letter-spacing:.02em}
.ctrl{display:flex;flex-direction:column;gap:5px}
.ctrl label{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
select{font:inherit;font-size:.9rem;padding:7px 12px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);min-width:170px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- secciones ---------- */
h2{font-size:1.02rem;font-weight:600;margin:38px 0 4px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:10px}
h2 .n{font-size:.7rem;font-weight:600;color:var(--ink-3);letter-spacing:.08em}
.lead{color:var(--ink-2);font-size:.82rem;margin:0 0 14px}
h3{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);margin:22px 0 8px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.kpi .k-big{font-size:2rem;font-weight:650;letter-spacing:-.03em;margin:8px 0 4px;
  display:flex;align-items:center;gap:7px;line-height:1.05}
.kpi .k-big .ar{font-size:1rem}
.kpi .k-cmp{font-size:.79rem;color:var(--ink-2)}
.kpi .k-cmp b{color:var(--ink);font-weight:600}
.kpi .k-nota{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-2);
  font-size:.75rem;color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}

/* ---------- tablas ---------- */
.caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.82rem}
th,td{padding:7px 10px;text-align:right;white-space:nowrap}
thead th{font-size:.7rem;font-weight:600;color:var(--ink-2);background:var(--surface-2);
  border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:2}
th.cat,td.cat{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;
  font-weight:600;border-right:1px solid var(--line)}
thead th.cat{background:var(--surface-2);z-index:3}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:nth-child(even) td.cat{background:var(--surface-2)}
tbody tr:hover td, tbody tr:hover td.cat{background:var(--surface-3)}
.tot td, .tot td.cat{background:var(--surface-3)!important;font-weight:650}
.sep-l{border-left:1px solid var(--line-2)}
tr.hueco td{height:5px;padding:0;background:var(--surface-3);border:0}
.d{font-weight:600}
.mut{color:var(--ink-3)}
.barra-d{display:inline-block;vertical-align:middle;width:56px;height:8px;position:relative}
.barra-d::before{content:"";position:absolute;left:50%;top:-1px;width:1px;height:10px;background:var(--line-2)}
.barra-d i{position:absolute;top:0;height:8px;border-radius:2px}

/* ---------- grafico ---------- */
.chart-caja{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px 10px}
.filtros{display:flex;flex-direction:column;gap:12px;margin-bottom:6px}
.fila-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f-tit{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:600;min-width:74px}
.seg{display:inline-flex;background:var(--surface-3);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:.79rem;border:0;background:none;color:var(--ink-2);
  padding:5px 13px;border-radius:6px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.09);font-weight:600}
.chip{font:inherit;font-size:.77rem;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink-2);padding:4px 10px;border-radius:20px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-3)}
.chip .pt{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.chip[aria-pressed="true"]{border-color:currentColor;color:var(--ink);font-weight:600;
  background:var(--surface-2)}
.chip[aria-pressed="true"] .pt{background:var(--c)}
.chip.lim{border-style:dashed}
.grupo-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.et-g{font-size:.72rem;color:var(--ink-3);font-weight:600;margin-right:2px}
.chart-hold{position:relative;margin-top:8px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:9px 11px;font-size:.78rem;
  min-width:150px;opacity:0;transition:opacity .09s;z-index:5}
.tip h4{margin:0 0 6px;font-size:.73rem;color:var(--ink-3);font-weight:600;
  text-transform:uppercase;letter-spacing:.06em}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between;margin-top:2px}
.tip .r span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .r b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tip .pt{width:8px;height:8px;border-radius:50%}

.nota{font-size:.75rem;color:var(--ink-2);margin-top:10px;line-height:1.6}
.avisos{background:#fff6e8;border:1px solid #e8bd7a;color:#6b3d06;border-radius:var(--r);
  padding:11px 15px;margin-bottom:18px;font-size:.79rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avisos{
  background:#2a1e0c;border-color:#6b4a1c;color:#e8b866}}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  font-size:.73rem;color:var(--ink-3)}
@media (max-width:640px){
  .wrap{padding:16px 13px 60px}
  .kpi .k-big{font-size:1.7rem}
  .f-tit{min-width:100%}
}
@media print{
  body{background:#fff}
  .scroll{overflow:visible}
  .filtros{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="marca">
      <div class="barra"></div>
      <div>
        <h1>TBM Dealer Analysis</h1>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="ctrl">
      <label for="mes">Informe</label>
      <select id="mes"></select>
    </div>
  </header>
  <div id="avisos"></div>
  <main id="app"></main>
  <footer id="pie"></footer>
</div>

<script>
const APP = /*__DATOS__*/null/*__FIN__*/;

const SEG_ES = {tractores:"Tractores", cosechadoras:"Cosechadoras"};
const TOT_ES = {AOR:"AOR", TERRITORIO:"Territorio", PAIS:"País"};
const TOTALES = ["AOR","TERRITORIO","PAIS"];
const SLOTS = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

/* ============================ helpers ============================ */
const num = (v,d=1)=> v==null ? "—" :
  v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const uni = v => v==null ? "—" : (Number.isInteger(v) ? num(v,0) : num(v,1));
const pc  = v => v==null ? "—" : num(v,1)+"%";
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function varPc(act, ant){
  if(act==null || ant==null || ant===0) return null;
  return (act-ant)/ant*100;
}
const cls = v => v==null ? "flat" : (v>0.05 ? "up" : (v<-0.05 ? "down" : "flat"));
const flecha = v => v==null ? "" : (v>0.05 ? "▲" : (v<-0.05 ? "▼" : "■"));
const txtVar = (v,suf="%") => v==null ? "—" : (v>0?"+":"")+num(v,1)+suf;

function tabla(mes, seg, per){
  return (mes.segmentos[seg]||{})[per] || null;
}
function fila(t, tipo){
  return t ? (t.filas.find(f=>f.tipo===tipo) || null) : null;
}
function val(t, tipo, clave){
  if(!t) return null;
  const i = t.columnas.indexOf(clave);
  const f = fila(t, tipo);
  return (i<0 || !f) ? null : f.valores[i];
}
/* mismo mes del año fiscal anterior, tal como se informó entonces */
function claveAnioAntes(clave){
  const [a,m] = clave.split("-").map(Number);
  return (a-1)+"-"+String(m).padStart(2,"0");
}

/* ============================ KPIs ============================ */
function kpis(mes){
  const cards = [];
  for(const seg of ["tractores","cosechadoras"]){
    const tf = tabla(mes,seg,"FYTD"), tl = tabla(mes,seg,"LFYTD");
    if(!tf || !tl) continue;
    const prev = APP.meses[claveAnioAntes(mes.clave)];
    const tprev = prev ? tabla(prev,seg,"FYTD") : null;

    for(const col of ["AOR","PAIS"]){
      const a = val(tf,"industria",col), b = val(tl,"industria",col);
      const v = varPc(a,b);
      const c = val(tprev,"industria",col);
      const v2 = varPc(a,c);
      let nota = "";
      if(v2!=null && Math.abs(v2-v) >= 3){
        nota = `<div class="k-nota">Contra el dato de <b>${esc(prev.fy)}</b> publicado en su momento
          (${uni(c)} u.): <b class="${cls(v2)}">${txtVar(v2)}</b>.
          El AOR del año anterior se recalcula hacia arriba con el correr de los meses.</div>`;
      }
      cards.push(`<div class="kpi">
        <div class="k-lbl">${SEG_ES[seg]} · Industria ${TOT_ES[col]}</div>
        <div class="k-big ${cls(v)}"><span class="ar">${flecha(v)}</span>${txtVar(v)}</div>
        <div class="k-cmp">FYTD <b>${uni(a)}</b> vs LFYTD <b>${uni(b)}</b> u.
          · ${a!=null&&b!=null ? (a-b>0?"+":"")+uni(a-b) : "—"} u.</div>
        ${nota}
      </div>`);
    }
  }
  return `<h2><span class="n">01</span> Variación de la industria</h2>
    <p class="lead">FYTD contra LFYTD, tal como los informa el reporte.</p>
    <div class="kpis">${cards.join("")}</div>`;
}

/* ==================== tablas tal cual el PDF ==================== */
function tablaPDF(mes, seg, per){
  const t = tabla(mes,seg,per);
  if(!t) return `<p class="nota">El informe de ${esc(mes.mes_es)} no trae esta tabla.</p>`;
  const n = t.columnas.length;
  const th = t.etiquetas.map((e,i)=>
    `<th${i===n-3?' class="sep-l"':""}>${esc(e)}</th>`).join("");
  const tr = t.filas.map(f=>`<tr${f.tipo==="industria"?' class="tot"':""}>
      <td class="cat">${esc(f.nombre)}</td>
      ${f.valores.map((v,i)=>`<td${i===n-3?' class="sep-l"':""}>${
        esc(f.textos && f.textos[i] ? f.textos[i] : (f.tipo==="share"?pc(v):uni(v)))
      }</td>`).join("")}
    </tr>`).join("");
  return `<div class="caja"><div class="scroll"><table>
    <thead><tr><th class="cat">${per}</th>${th}</tr></thead>
    <tbody>${tr}</tbody></table></div></div>`;
}

/* ============== tabla comparativa por categoría ============== */
function tablaComparativa(mes, seg){
  const tf = tabla(mes,seg,"FYTD"), tl = tabla(mes,seg,"LFYTD");
  if(!tf || !tl) return "";
  const claves = [];
  for(const t of [tf,tl]) t.columnas.forEach((c,i)=>{
    if(!claves.some(x=>x.k===c)) claves.push({k:c, et:t.etiquetas[i]});
  });
  const cats = claves.filter(c=>!TOTALES.includes(c.k));
  const tots = TOTALES.filter(t=>claves.some(c=>c.k===t)).map(t=>({k:t, et:TOT_ES[t]}));

  const varsCat = cats.map(c=>varPc(val(tf,"industria",c.k), val(tl,"industria",c.k)))
                      .filter(v=>v!=null).map(Math.abs);
  const max = Math.max(60, ...varsCat);

  const dealerNom = (fila(tf,"dealer")||{}).nombre || "Dealer";

  const linea = (c, esTot)=>{
    const iF=val(tf,"industria",c.k), iL=val(tl,"industria",c.k);
    const dF=val(tf,"dealer",c.k),    dL=val(tl,"dealer",c.k);
    const sF=val(tf,"share",c.k),     sL=val(tl,"share",c.k);
    const vi=varPc(iF,iL), vd=varPc(dF,dL);
    const ds=(sF!=null&&sL!=null)?sF-sL:null;
    const bar = vi==null ? '<span class="mut">—</span>' :
      `<span class="barra-d"><i style="${vi>=0?"left:50%":"right:50%"};width:${
        Math.min(Math.abs(vi)/max,1)*27}px;background:var(--${vi>=0?"up-fill":"down-fill"})"></i></span>`;
    return `<tr${esTot?' class="tot"':""}>
      <td class="cat">${esc(c.et)}</td>
      <td>${uni(iF)}</td><td class="mut">${uni(iL)}</td>
      <td class="d ${cls(vi)}">${flecha(vi)} ${txtVar(vi)}</td><td>${bar}</td>
      <td class="sep-l">${uni(dF)}</td><td class="mut">${uni(dL)}</td>
      <td class="d ${cls(vd)}">${flecha(vd)} ${txtVar(vd)}</td>
      <td class="sep-l">${pc(sF)}</td><td class="mut">${pc(sL)}</td>
      <td class="d ${cls(ds)}">${flecha(ds)} ${txtVar(ds," pp")}</td>
    </tr>`;
  };

  return `<div class="caja"><div class="scroll"><table>
    <thead>
      <tr>
        <th class="cat" rowspan="2">Categoría</th>
        <th colspan="4">Industria · unidades</th>
        <th colspan="3" class="sep-l">${esc(dealerNom)} · unidades</th>
        <th colspan="3" class="sep-l">Market Share</th>
      </tr>
      <tr>
        <th>FYTD</th><th>LFYTD</th><th>Var.</th><th></th>
        <th class="sep-l">FYTD</th><th>LFYTD</th><th>Var.</th>
        <th class="sep-l">FYTD</th><th>LFYTD</th><th>Var.</th>
      </tr>
    </thead>
    <tbody>
      ${cats.map(c=>linea(c,false)).join("")}
      <tr class="hueco"><td colspan="11"></td></tr>
      ${tots.map(c=>linea(c,true)).join("")}
    </tbody>
  </table></div></div>`;
}

function seccionSegmento(mes, seg, n){
  return `<h2><span class="n">${n}</span> ${SEG_ES[seg]}</h2>
    <p class="lead">Las dos tablas del informe, sin retocar, y abajo la comparación por categoría.</p>
    <h3>Tabla del informe · FYTD</h3>${tablaPDF(mes,seg,"FYTD")}
    <h3>Tabla del informe · LFYTD</h3>${tablaPDF(mes,seg,"LFYTD")}
    <h3>FYTD vs LFYTD por categoría</h3>${tablaComparativa(mes,seg)}
    <p class="nota">La variación de market share va en puntos porcentuales (pp).
    El dealer opera dentro de su AOR: sus unidades se repiten en AOR, Territorio y País,
    lo que cambia es contra qué universo se mide el share.</p>`;
}

/* ============================ gráfico ============================ */
const G = {
  medida: "industria",
  activas: [],          // [{id, seg, key, label, slot}]
  libres: SLOTS.map((_,i)=>i),
};

function idSerie(seg,key){ return seg+"|"+key; }

function seriesDisponibles(){
  const out = [];
  for(const seg of ["tractores","cosechadoras"]){
    const s = APP.series[seg];
    if(!s || !s.puntos.length) continue;
    out.push({seg, grupo:SEG_ES[seg], items:[
      {key:"AOR", label:"Total AOR"},
      ...s.categorias.map(c=>({key:c.key, label:c.label}))
    ]});
  }
  return out;
}

function toggleSerie(seg,key,label){
  const id = idSerie(seg,key);
  const i = G.activas.findIndex(a=>a.id===id);
  if(i>=0){
    G.libres.push(G.activas[i].slot);
    G.libres.sort((a,b)=>a-b);
    G.activas.splice(i,1);
  }else{
    if(!G.libres.length) return false;      // tope de 8 series
    G.activas.push({id, seg, key, label, slot:G.libres.shift()});
  }
  return true;
}

function puntosDe(seg){ return (APP.series[seg]||{}).puntos || []; }

/* eje x común: todos los meses con serie, de cualquiera de los dos segmentos */
function mesesSerie(){
  const set = new Map();
  for(const seg of ["tractores","cosechadoras"])
    for(const p of puntosDe(seg)) set.set(p.clave, p.mes+"|"+p.fy);
  return [...set.entries()].sort((a,b)=>a[0]<b[0]?-1:1)
    .map(([clave,v])=>({clave, mes:v.split("|")[0], fy:v.split("|")[1]}));
}

function valorSerie(seg, key, clave){
  const p = puntosDe(seg).find(p=>p.clave===clave);
  if(!p) return null;
  const v = (p[G.medida]||{})[key];
  return v===undefined ? null : v;
}

/* paso de eje redondo: 1, 2, 2.5, 5, 10, 20, 25, 50, ... */
function pasoLindo(bruto){
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(bruto, 1e-6))));
  const n = bruto / e;
  const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return Math.max(m * e, 1);
}

function dibujarChart(){
  const cont = document.getElementById("chart-hold");
  const eje = mesesSerie();
  if(!eje.length){ cont.innerHTML = `<p class="nota">Hace falta más de un informe.</p>`; return; }

  const W=1000, H=340, mL=44, mR=30, mT=14, mB=30;
  const iw = W-mL-mR, ih = H-mT-mB;
  const x = i => mL + (eje.length===1 ? iw/2 : i*iw/(eje.length-1));

  let maxV = 0;
  const datos = G.activas.map(a=>({
    ...a,
    pts: eje.map((e,i)=>{
      const v = valorSerie(a.seg, a.key, e.clave);
      if(v!=null && v>maxV) maxV = v;
      return {i, v};
    })
  }));
  const paso = pasoLindo(Math.max(4, maxV*1.1) / 5);
  const topN = paso * Math.max(1, Math.ceil(Math.max(4, maxV*1.02) / paso));
  const y = v => mT + ih - (v/topN)*ih;

  const grid = [], etY = [];
  for(let v=0; v<=topN; v+=paso){
    grid.push(`<line x1="${mL}" x2="${W-mR}" y1="${y(v)}" y2="${y(v)}"
      stroke="var(--line)" stroke-width="1"/>`);
    etY.push(`<text x="${mL-8}" y="${y(v)+4}" text-anchor="end"
      fill="var(--ink-3)" font-size="11">${v}</text>`);
  }

  // separadores de año fiscal (noviembre) y etiquetas de mes
  const fy = [], etX = [];
  eje.forEach((e,i)=>{
    if(i>0 && e.fy !== eje[i-1].fy){
      fy.push(`<line x1="${x(i)}" x2="${x(i)}" y1="${mT}" y2="${mT+ih}"
        stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 3"/>`);
      fy.push(`<text x="${x(i)+5}" y="${mT+11}" fill="var(--ink-3)"
        font-size="10.5" font-weight="600">${e.fy}</text>`);
    }
    const cada = eje.length>14 ? 2 : 1;
    if(i%cada===0 || i===eje.length-1){
      // el primero y el ultimo se anclan a su borde para que no se corten
      const anc = i===0 ? "start" : (i===eje.length-1 ? "end" : "middle");
      etX.push(`<text x="${x(i)}" y="${H-9}" text-anchor="${anc}"
        fill="var(--ink-3)" font-size="10.5">${e.mes}</text>`);
    }
  });

  const lineas = datos.map(d=>{
    const tramos = [];
    let act = [];
    d.pts.forEach(p=>{
      if(p.v==null){ if(act.length) tramos.push(act); act=[]; }
      else act.push(`${x(p.i)},${y(p.v)}`);
    });
    if(act.length) tramos.push(act);
    const path = tramos.map(t=>
      t.length===1
        ? `<circle cx="${t[0].split(",")[0]}" cy="${t[0].split(",")[1]}" r="3.4" fill="var(${SLOTS[d.slot]})"/>`
        : `<polyline points="${t.join(" ")}" fill="none" stroke="var(${SLOTS[d.slot]})"
             stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    ).join("");
    const marcas = datos.length<=3
      ? d.pts.filter(p=>p.v!=null).map(p=>
          `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="2.6" fill="var(--surface)"
            stroke="var(${SLOTS[d.slot]})" stroke-width="1.6"/>`).join("")
      : "";
    return path+marcas;
  }).join("");

  const vacio = !datos.length
    ? `<text x="${W/2}" y="${mT+ih/2}" text-anchor="middle" fill="var(--ink-3)"
        font-size="13">Elegí una o más categorías abajo</text>` : "";

  cont.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Evolución mensual de unidades">
      ${grid.join("")}${fy.join("")}
      <line x1="${mL}" x2="${W-mR}" y1="${mT+ih}" y2="${mT+ih}" stroke="var(--line-2)"/>
      ${etY.join("")}${etX.join("")}
      ${lineas}${vacio}
      <line id="cruz" x1="0" x2="0" y1="${mT}" y2="${mT+ih}" stroke="var(--ink-3)"
        stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
      <rect x="${mL}" y="${mT}" width="${iw}" height="${ih}" fill="transparent" id="captura"/>
    </svg>
    <div class="tip" id="tip"></div>`;

  const svg = cont.querySelector("svg");
  const tip = cont.querySelector("#tip");
  const cruz = cont.querySelector("#cruz");
  cont.querySelector("#captura").addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((px-mL)/(iw/Math.max(eje.length-1,1)));
    i = Math.max(0, Math.min(eje.length-1, i));
    cruz.setAttribute("x1", x(i)); cruz.setAttribute("x2", x(i));
    cruz.setAttribute("opacity", "1");
    const filas = datos.map(d=>{
      const p = d.pts[i];
      return `<div class="r"><span><i class="pt" style="background:var(${SLOTS[d.slot]})"></i>
        ${esc(d.label)}${d.seg==="cosechadoras"?" (cos.)":""}</span><b>${p.v==null?"—":uni(p.v)}</b></div>`;
    }).join("");
    tip.innerHTML = `<h4>${esc(eje[i].mes)} · ${esc(eje[i].fy)}</h4>${filas ||
      '<div class="r"><span>sin series</span></div>'}`;
    tip.style.opacity = "1";
    const izq = x(i)/W * r.width;
    tip.style.left = Math.min(Math.max(izq+14, 0), r.width-tip.offsetWidth-4)+"px";
    tip.style.top = "6px";
  });
  cont.querySelector("#captura").addEventListener("mouseleave", ()=>{
    tip.style.opacity="0"; cruz.setAttribute("opacity","0");
  });
}

function pintarChips(){
  document.querySelectorAll("[data-serie]").forEach(b=>{
    const a = G.activas.find(a=>a.id===b.dataset.serie);
    b.setAttribute("aria-pressed", a?"true":"false");
    b.style.setProperty("--c", a?`var(${SLOTS[a.slot]})`:"var(--line-2)");
    b.style.color = a ? `var(${SLOTS[a.slot]})` : "";
  });
  const t = document.getElementById("tope");
  if(t) t.style.display = G.libres.length ? "none" : "inline";
}

function seccionChart(){
  const grupos = seriesDisponibles().map(g=>`
    <div class="grupo-chips"><span class="et-g">${g.grupo}</span>
      ${g.items.map(it=>`<button class="chip" type="button"
         data-serie="${idSerie(g.seg,it.key)}"
         data-seg="${g.seg}" data-key="${esc(it.key)}" data-label="${esc(it.label)}"
         aria-pressed="false"><i class="pt"></i>${esc(it.label)}</button>`).join("")}
    </div>`).join("");

  return `<h2><span class="n">02</span> Evolución mensual</h2>
    <p class="lead">Unidades de cada mes, no acumuladas: se calculan como la diferencia
      entre el FYTD de un informe y el del anterior. La línea punteada marca el arranque
      del año fiscal.</p>
    <div class="chart-caja">
      <div class="filtros">
        <div class="fila-f">
          <span class="f-tit">Medida</span>
          <div class="seg" id="medida">
            <button type="button" data-m="industria" aria-pressed="true">Industria</button>
            <button type="button" data-m="dealer" aria-pressed="false">Cetomaq</button>
          </div>
          <span class="f-tit" style="min-width:auto;margin-left:10px">Atajos</span>
          <button class="chip lim" type="button" data-preset="totales">Totales AOR</button>
          <button class="chip lim" type="button" data-preset="tractores">Tractores por potencia</button>
          <button class="chip lim" type="button" data-preset="cosechadoras">Cosechadoras por clase</button>
          <button class="chip lim" type="button" data-preset="limpiar">Limpiar</button>
          <span class="mut" id="tope" style="display:none;font-size:.75rem">
            máximo 8 series a la vez</span>
        </div>
        <div class="fila-f" style="align-items:flex-start">
          <span class="f-tit">Categorías</span>
          <div style="display:flex;flex-direction:column;gap:7px">${grupos}</div>
        </div>
      </div>
      <div class="chart-hold" id="chart-hold"></div>
    </div>`;
}

function preset(cual){
  G.activas = []; G.libres = SLOTS.map((_,i)=>i);
  const s = seriesDisponibles();
  if(cual==="totales")
    s.forEach(g=>toggleSerie(g.seg,"AOR","Total AOR"));
  if(cual==="tractores"){
    const g = s.find(g=>g.seg==="tractores");
    if(g) g.items.filter(i=>i.key!=="AOR").slice(-8)
           .forEach(i=>toggleSerie("tractores",i.key,i.label));
  }
  if(cual==="cosechadoras"){
    const g = s.find(g=>g.seg==="cosechadoras");
    if(g) g.items.filter(i=>i.key!=="AOR")
           .forEach(i=>toggleSerie("cosechadoras",i.key,i.label));
  }
  pintarChips(); dibujarChart();
}

function conectarChart(){
  document.querySelectorAll("[data-serie]").forEach(b=>{
    b.onclick = ()=>{
      toggleSerie(b.dataset.seg, b.dataset.key, b.dataset.label);
      pintarChips(); dibujarChart();
    };
  });
  document.querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick = ()=> preset(b.dataset.preset);
  });
  document.querySelectorAll("#medida button").forEach(b=>{
    b.onclick = ()=>{
      G.medida = b.dataset.m;
      document.querySelectorAll("#medida button").forEach(o=>
        o.setAttribute("aria-pressed", String(o===b)));
      dibujarChart();
    };
  });
}

/* ============================ render ============================ */
function render(clave){
  const mes = APP.meses[clave];
  const meses = Object.keys(APP.meses).length;
  document.getElementById("sub").innerHTML =
    `<b>${esc(mes.dealer)}</b> · ${esc(mes.mes_es)}
     <span class="pill">${esc(mes.fy)}</span>
     <span>${meses} informes cargados</span>`;
  document.title = `TBM ${mes.dealer} — ${mes.mes_es}`;

  document.getElementById("app").innerHTML =
    kpis(mes) + seccionChart() +
    seccionSegmento(mes,"tractores","03") +
    seccionSegmento(mes,"cosechadoras","04");

  conectarChart();
  preset("totales");

  document.getElementById("pie").innerHTML =
    `Fuente: <b>${esc(mes.archivo)}</b> · John Deere TBM Dealer Analysis` +
    (mes.fuente ? ` · <b>${esc(mes.fuente)}</b>` : "") +
    ` · dashboard generado ${esc(APP.generado)}`;
}

function init(){
  if(!APP || !APP.meses || !Object.keys(APP.meses).length){
    document.getElementById("app").innerHTML =
      "<p>No hay datos. Ejecutá <code>python procesar_tbm.py</code>.</p>";
    return;
  }
  const claves = Object.keys(APP.meses).sort().reverse();
  const sel = document.getElementById("mes");
  sel.innerHTML = claves.map(c=>
    `<option value="${c}">${esc(APP.meses[c].mes_es)}</option>`).join("");
  sel.onchange = ()=> render(sel.value);
  if(APP.avisos && APP.avisos.length)
    document.getElementById("avisos").innerHTML =
      `<div class="avisos"><b>Avisos del procesamiento</b><br>${
        APP.avisos.map(esc).join("<br>")}</div>`;
  render(claves[0]);
}
init();
</script>
