<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBM Dealer Analysis</title>
<style>
:root{
  color-scheme: light;
  --jd:#367C2B;            /* verde John Deere */
  --jd-osc:#2a6021;
  --jd-cl:#eaf2e6;
  --amarillo:#FFDE00;
  --bg:#f4f5f1;
  --sup:#ffffff;
  --sup-2:#fafbf8;
  --hl:#fff9d6;
  --line:#e4e5df;
  --line-2:#cfd0c8;
  --ink:#16180f;
  --ink-2:#585a50;
  --ink-3:#8b8d82;
  --up:#0a7a0a; --down:#a92c2c;
  --sombra:0 1px 2px rgba(22,24,15,.05), 0 2px 14px rgba(22,24,15,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --jd:#4e9c40; --jd-osc:#1d3f17; --jd-cl:#1e2b1a;
    --amarillo:#FFDE00;
    --bg:#101208; --sup:#1a1d16; --sup-2:#1f231b; --hl:#332d10;
    --line:#2c3026; --line-2:#40453a;
    --ink:#eef1e8; --ink-2:#b0b4a7; --ink-3:#83877b;
    --up:#4ec94e; --down:#f08080;
    --sombra:0 1px 2px rgba(0,0,0,.45), 0 2px 14px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}

/* ---------- terminacion visual ----------
   Todo lo de abajo es cosmetico: ningun efecto cambia un numero. Al final del
   bloque, prefers-reduced-motion los apaga a todos. */

/* Aparicion escalonada al entrar en pantalla. Deliberadamente SIN fill-mode:
   el estado de reposo del elemento es visible, la animacion solo lo trae desde
   transparente. Asi ningun efecto puede dejar la pagina en blanco. */
@keyframes entraBloque{from{opacity:0;transform:translateY(14px)}
                       to{opacity:1;transform:none}}
.entra{animation:entraBloque .52s cubic-bezier(.22,.7,.3,1)}

/* numeros que entran solos cuando se recalcula la ficha */
@keyframes subeNumero{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ficha .hoy{animation:subeNumero .42s cubic-bezier(.22,.7,.3,1) both}
.ficha .linea:nth-child(2) .hoy{animation-delay:.04s}
.ficha .linea:nth-child(3) .hoy{animation-delay:.08s}
.ficha .linea:nth-child(4) .hoy{animation-delay:.12s}
.ficha .delta{animation:subeNumero .42s cubic-bezier(.22,.7,.3,1) both;animation-delay:.06s}
.ficha .linea{border-radius:5px;margin:0 -7px;padding:3px 7px;
  transition:background .16s ease}
.ficha .linea:hover{background:var(--sup-2)}


/* cajas que responden al mouse */
.caja,.panel,.ficha{transition:box-shadow .2s ease, border-color .2s ease}
.caja:hover,.panel:hover{box-shadow:0 1px 2px rgba(22,24,15,.06), 0 6px 22px rgba(22,24,15,.09)}

/* controles con algo de vida */
.seg button,.ly,.acc,.ov,.chip,.abrir-ind,.mini{
  transition:background .16s ease, color .16s ease, border-color .16s ease,
             transform .12s ease, box-shadow .16s ease}
.seg button:hover{transform:translateY(-1px)}
.seg button[aria-pressed="true"]{box-shadow:0 2px 6px rgba(54,124,43,.32)}
.ly:hover,.ov:hover,.acc:hover{transform:translateY(-1px)}
.abrir-ind:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(54,124,43,.34)}
.abrir-ind:active,.seg button:active,.ly:active{transform:translateY(0)}
.mini:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.10)}

/* columna resaltada y filas de las tablas */
tbody td,thead th{transition:background .14s ease}
tbody tr{transition:transform .12s ease}

/* ventana flotante: entra en vez de aparecer de golpe */
@keyframes abreVentana{from{opacity:0;transform:translateY(10px) scale(.985)}
                       to{opacity:1;transform:none}}
.flot:not([hidden]){animation:abreVentana .22s cubic-bezier(.22,.7,.3,1)}

/* globo y cruz del grafico */
.tip{transition:opacity .12s ease}
#cruz{transition:opacity .12s ease}
#marcas-foco circle{animation:subeNumero .2s ease both}
.marca-dec circle{transition:r .14s ease}
.marca-dec:hover circle:last-of-type{r:7}

@media (prefers-reduced-motion: reduce){
  .entra{animation:none}
  .ficha .hoy,.ficha .delta,#marcas-foco circle{animation:none}
  .flot:not([hidden]){animation:none}
  .seg button:hover,.ly:hover,.ov:hover,.acc:hover,.abrir-ind:hover,.mini:hover{transform:none}
}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,Inter,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---------- banda superior ---------- */
.tope{background:linear-gradient(100deg,var(--jd-osc) 0%,var(--jd) 40%,var(--jd) 66%,var(--jd-osc) 100%);
  border-bottom:4px solid var(--amarillo);position:relative;overflow:hidden}
.tope::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.10) 46%,transparent 62%)}
.tope-in{position:relative;z-index:1}
.tope-in{max-width:1200px;margin:0 auto;padding:20px 24px 18px;
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.tope h1{margin:0;color:#fff;font-size:1.3rem;font-weight:650;letter-spacing:-.02em}
.tope .quien{color:rgba(255,255,255,.85);font-size:.82rem;margin-top:3px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tope .fy{background:var(--amarillo);color:#2a2a00;font-weight:700;font-size:.7rem;
  padding:1px 8px;border-radius:3px;letter-spacing:.03em}
.tope .hoy{margin-left:2px;padding-left:11px;border-left:1px solid rgba(255,255,255,.32);
  color:rgba(255,255,255,.92)}
.tope .hoy b{font-weight:700;color:#fff}
.tope .hoy i{font-style:normal;color:rgba(255,255,255,.65);font-size:.72rem;margin-left:4px}
.tope label{display:block;color:rgba(255,255,255,.8);font-size:.68rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px}
.tope select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.tope select option{color:#16180f;background:#fff}

.wrap{max-width:1200px;margin:0 auto;padding:0 24px 80px}
section{margin-top:42px}
.rotulo{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.rotulo b{font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.rotulo i{width:22px;height:3px;background:var(--amarillo);border-radius:2px;flex:none}
.lead{color:var(--ink-2);font-size:.81rem;margin:0 0 16px;max-width:78ch}

.barra{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.campo{display:flex;align-items:center;gap:7px}
.campo>span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:700}
select{font:inherit;font-size:.83rem;padding:5px 10px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--sup);color:var(--ink)}
select:focus-visible,button:focus-visible{outline:2px solid var(--jd);outline-offset:2px}
.seg{display:inline-flex;background:var(--sup);border:1px solid var(--line-2);
  border-radius:7px;padding:2px}
.seg button{font:inherit;font-size:.81rem;border:0;background:none;color:var(--ink-2);
  padding:5px 15px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jd);color:#fff;font-weight:650}
.seg button[aria-pressed="false"]:hover{background:var(--jd-cl);color:var(--jd)}

/* ---------- tablas ---------- */
/* ---------- fichas de cabecera ---------- */
.fichas{max-width:780px;margin:26px 0 4px}
.ficha{background:var(--sup);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--sombra);border-top:3px solid var(--jd);overflow:hidden}
.ficha.cos{border-top-color:#c96a2e}
.ficha-cab{display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;padding:11px 16px 10px;border-bottom:1px solid var(--line)}
.ficha-cab select{font-size:.76rem;padding:3px 6px;border-radius:5px}
.ficha-per{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--ink-3)}
.ficha-vs{font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--ink-2);
  text-transform:none}
.ficha-cab b{font-size:.92rem;font-weight:650;letter-spacing:-.01em}
.ficha-cab span{font-size:.7rem;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3)}
.ficha-cuerpo{display:grid;grid-template-columns:1fr 1fr}
.ambito{padding:11px 16px 13px}
.ambito+.ambito{border-left:1px solid var(--line)}
.ambito h4{margin:0 0 7px;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--jd)}
.ficha.cos .ambito h4{color:#a8541f}
.linea{display:grid;grid-template-columns:1fr auto;gap:4px 8px;
  align-items:baseline;padding:3px 0}
.linea+.linea{border-top:1px dotted var(--line)}
.linea .rot{font-size:.72rem;color:var(--ink-2)}
.linea .hoy{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:right}
.linea .antes{font-size:.68rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.linea .delta{font-size:.72rem;font-weight:650;text-align:right;
  font-variant-numeric:tabular-nums}
@media (max-width:460px){.ficha-cuerpo{grid-template-columns:1fr}
  .ambito+.ambito{border-left:0;border-top:1px solid var(--line)}}

.caja{background:var(--sup);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;box-shadow:var(--sombra)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.81rem}
th,td{padding:7px 11px;text-align:right;white-space:nowrap}
thead th{font-size:.69rem;font-weight:700;color:var(--jd);background:var(--jd-cl);
  border-bottom:2px solid var(--jd);cursor:pointer;user-select:none}
thead th:hover{background:var(--amarillo);color:#2a2a00}
th.cat,td.cat{text-align:left;position:sticky;left:0;background:var(--sup);
  font-weight:650;border-right:1px solid var(--line)}
thead th.cat{background:var(--jd-cl);cursor:default}
thead th.cat:hover{background:var(--jd-cl);color:var(--jd)}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td,tbody tr:hover td.cat{background:var(--sup-2)}
td.marca,th.marca{background:var(--hl)!important}
td.col-hover,th.col-hover{background:var(--jd-cl)}
td.marca.col-hover,th.marca.col-hover{background:var(--amarillo)!important}
.sep-l{border-left:1px solid var(--line-2)}
.ind td,.ind td.cat{font-weight:700;background:var(--sup-2)}
.tit-tabla{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink-3);margin:24px 0 7px}
.mut{color:var(--ink-3)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}

/* ---------- grafico ---------- */
.panel{background:var(--sup);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--sombra);padding:16px 18px 12px}
.chart-tit{font-size:.86rem;font-weight:650;margin-bottom:2px}
.chart-sub{font-size:.75rem;color:var(--ink-3);margin-bottom:8px}
.chart-hold{position:relative}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.serie{transition:opacity .14s ease, stroke-width .14s ease}
polyline.serie{stroke-dasharray:1;stroke-dashoffset:1;
  animation:trazo .85s cubic-bezier(.25,.8,.3,1) forwards;
  animation-delay:calc(var(--i,0) * 28ms)}
@keyframes trazo{to{stroke-dashoffset:0}}
/* al terminar el trazado la linea de Cetomaq queda punteada */
polyline.serie.punteada{animation-name:trazo,puntear;
  animation-duration:.85s,.01s;animation-delay:calc(var(--i,0)*28ms),
  calc(var(--i,0)*28ms + .85s);animation-fill-mode:forwards,forwards}
@keyframes puntear{to{stroke-dasharray:5 3;stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){
  polyline.serie.punteada{animation:none;stroke-dasharray:5 3;stroke-dashoffset:0}
}
.serie.foco{filter:drop-shadow(0 1.5px 3px rgba(0,0,0,.28))}
#area-foco{transition:opacity .18s ease;pointer-events:none}
#marcas-foco circle{pointer-events:none}
.fy-banda{pointer-events:none}
@media (prefers-reduced-motion: reduce){
  polyline.serie{animation:none;stroke-dashoffset:0}
  .serie{transition:none}
}
.tip{position:absolute;pointer-events:none;background:var(--sup);
  border:1px solid var(--line-2);border-radius:7px;box-shadow:0 6px 22px rgba(0,0,0,.16);
  padding:9px 11px;font-size:.77rem;min-width:180px;opacity:0;transition:opacity .09s;z-index:5}
.tip h4{margin:0 0 6px;font-size:.7rem;color:var(--ink-3);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em}
.tip .r{display:flex;gap:14px;justify-content:space-between;margin-top:1px}
.tip .r span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.tip .r b{color:var(--ink)}
.tip .r.foco span,.tip .r.foco b{color:var(--ink);font-weight:700}
.tip .pt{width:9px;height:3px;border-radius:2px;flex:none}

.cinta-ret{font-size:9.5px;font-weight:700}
.marca-dec{cursor:help}
.tip .ev-tit{font-weight:650;color:var(--ink);margin-bottom:3px}
.tip .ev-det{color:var(--ink-2);font-size:.73rem;line-height:1.5;white-space:normal}
.tip.ancho{width:310px;max-width:310px}
.tira-tc{font-size:9.5px}
.ov-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ov-chips .et{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:700;margin-right:2px}
.ov{font:inherit;font-size:.73rem;border:1px solid var(--line-2);background:var(--sup);
  color:var(--ink-2);padding:3px 10px;border-radius:20px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.ov i{width:9px;height:9px;border-radius:2px;background:var(--line-2);flex:none}
.ov[aria-pressed="true"]{border-color:var(--jd);color:var(--jd);font-weight:650;
  background:var(--jd-cl)}
.ov[aria-pressed="true"] i{background:var(--amarillo)}
.leyenda{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}
.ly{font:inherit;font-size:.73rem;border:1px solid var(--line-2);background:var(--sup);
  color:var(--ink-2);padding:2px 9px 2px 6px;border-radius:4px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px}
.ly i{width:11px;height:3px;border-radius:2px;background:var(--c,var(--line-2));flex:none}
.ly[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.ly-grupo{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:700;align-self:center;margin:0 2px 0 6px}
.ly-grupo:first-child{margin-left:0}
.ly:hover{border-color:var(--jd);color:var(--ink)}
.acciones{display:flex;gap:7px;margin-left:auto}
.acc{font:inherit;font-size:.72rem;border:1px solid var(--line-2);background:var(--sup);
  color:var(--ink-2);padding:2px 9px;border-radius:4px;cursor:pointer}
.acc:hover{border-color:var(--jd);color:var(--jd)}

details.plegable{margin:10px 0 0}
details.plegable>summary{cursor:pointer;font-size:.78rem;color:var(--jd);font-weight:600;
  padding:6px 0;user-select:none;list-style:none}
details.plegable>summary::before{content:"\25B8  "}
details.plegable[open]>summary::before{content:"\25BE  "}

/* ---------- ventana flotante de indicadores ---------- */
.abrir-ind{font:inherit;font-size:.79rem;font-weight:600;border:1px solid var(--jd);
  background:var(--jd);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.abrir-ind:hover{background:var(--jd-osc);border-color:var(--jd-osc)}
.abrir-ind i{width:9px;height:9px;border-radius:2px;background:var(--amarillo);flex:none}
.flot{position:fixed;right:22px;bottom:22px;width:540px;max-width:calc(100vw - 28px);
  background:var(--sup);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:0 12px 40px rgba(0,0,0,.24);z-index:60;overflow:hidden;
  display:flex;flex-direction:column;max-height:calc(100vh - 44px)}
.flot[hidden]{display:none}
.flot-cab{background:var(--jd);color:#fff;padding:9px 12px;cursor:grab;user-select:none;
  display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--amarillo)}
.flot-cab.arrastrando{cursor:grabbing}
.flot-cab b{font-size:.83rem;font-weight:650;flex:1}
.flot-cab .rango{font-size:.71rem;color:rgba(255,255,255,.8);font-weight:500}
.flot-cab button{background:rgba(255,255,255,.16);border:0;color:#fff;width:22px;height:22px;
  border-radius:4px;cursor:pointer;font-size:.9rem;line-height:1;flex:none}
.flot-cab button:hover{background:rgba(255,255,255,.32)}
.flot-cuerpo{padding:12px 14px 14px;overflow:auto}
.flot-tit{font-size:.78rem;font-weight:650;margin-bottom:1px}
.flot-uni{font-size:.7rem;color:var(--ink-3);margin-bottom:4px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.mini{border:1px solid var(--line);border-radius:6px;padding:6px 7px 4px;cursor:pointer;
  background:var(--sup-2);text-align:left}
.mini:hover{border-color:var(--jd)}
.mini[aria-pressed="true"]{border-color:var(--jd);background:var(--jd-cl)}
.mini .n{font-size:.66rem;color:var(--ink-2);font-weight:600;line-height:1.25;
  display:block;height:2.5em;overflow:hidden}
.mini .v{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.mini .cuando{font-size:.62rem;color:var(--ink-3);margin-left:5px}
.mas-alla{font-size:.7rem;color:var(--ink-2);background:var(--sup-2);
  border-left:3px solid var(--amarillo);padding:6px 9px;border-radius:0 4px 4px 0;
  margin:6px 0 8px;line-height:1.45}
.mini svg{display:block;width:100%;height:26px;margin-top:2px}
@media (max-width:640px){
  .flot{right:0;left:0;bottom:0;width:auto;max-width:none;border-radius:12px 12px 0 0;
    max-height:78vh}
}
.nota{font-size:.74rem;color:var(--ink-3);margin-top:11px;line-height:1.6;max-width:86ch}
.avisos{background:#fff6e8;border:1px solid #e8bd7a;color:#6b3d06;
  border-radius:8px;padding:11px 15px;margin:16px 0;font-size:.78rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avisos{
  background:#2a1e0c;border-color:#6b4a1c;color:#e8b866}}
footer{margin-top:52px;padding-top:15px;border-top:1px solid var(--line);
  font-size:.72rem;color:var(--ink-3)}
@media (max-width:640px){.tope-in,.wrap{padding-left:14px;padding-right:14px}}
@media print{.barra,details.plegable,.acciones{display:none}}
</style>
</head>
<body>
<div class="tope">
  <div class="tope-in">
    <div>
      <h1 id="titulo">TBM Dealer Analysis</h1>
      <div class="quien" id="sub"></div>
    </div>
    <div>
      <label for="mes">Informe</label>
      <select id="mes"></select>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="avisos"></div>

  <div class="fichas" id="fichas"></div>

  <section>
    <div class="rotulo"><i></i><b>Tablas del informe</b></div>
    <div class="barra">
      <div class="seg" id="segmento">
        <button type="button" data-seg="tractores" aria-pressed="true">Tractores</button>
        <button type="button" data-seg="cosechadoras" aria-pressed="false">Cosechadoras</button>
      </div>
    </div>
    <div id="tablas"></div>
  </section>

  <section>
    <div class="rotulo"><i></i><b>Evolución mensual por tipo de máquina</b></div>
    <div class="barra" id="ctrl"></div>
    <div class="ov-chips" id="ov-chips" style="margin:-4px 0 12px">
      <span class="et">Proyectar sobre el gráfico</span>
      <button class="ov" type="button" data-ov="decretos" aria-pressed="true"><i></i>Decretos</button>
      <button class="ov" type="button" data-ov="retenciones" aria-pressed="true"><i></i>Retenciones</button>
      <button class="ov" type="button" data-ov="tc" aria-pressed="false"><i></i>Dólar oficial</button>
    </div>
    <div class="panel">
      <div class="chart-tit" id="chart-tit"></div>
      <div class="chart-sub" id="chart-sub"></div>
      <div class="chart-hold" id="chart-hold"></div>
      <div class="leyenda" id="leyenda"></div>
    </div>
    <div style="margin-top:12px">
      <button class="abrir-ind" type="button" id="abrir-ind"><i></i>Tasas e indicadores</button>
    </div>
  </section>

  <div class="flot" id="flot" hidden role="dialog" aria-label="Tasas e indicadores">
    <div class="flot-cab" id="flot-cab">
      <b>Tasas e indicadores</b>
      <span class="rango" id="flot-rango"></span>
      <button type="button" id="flot-cerrar" title="Cerrar" aria-label="Cerrar">×</button>
    </div>
    <div class="flot-cuerpo" id="flot-cuerpo"></div>
  </div>

  <footer id="pie"></footer>
</div>

<script>
const APP = /*__DATOS__*/null/*__FIN__*/;
const IND = (APP && APP.indicadores) || null;

const SEG_ES = {tractores:"Tractores", cosechadoras:"Cosechadoras"};

/* Las bandas de potencia son una escala ORDENADA, no categorias sueltas: por eso
   cada segmento usa una rampa de un solo tono, de claro (chica) a oscuro (grande),
   en vez de 18 colores distintos que nadie puede distinguir. */
const RAMPAS = {
  tractores:   {claro:"#b8d8ff", oscuro:"#06214a", dark:["#e2efff","#2f6fc4"]},
  cosechadoras:{claro:"#fbd3b0", oscuro:"#5c1f06", dark:["#fde8d8","#c96a2e"]},
};
const oscuro = () => window.matchMedia &&
  window.matchMedia("(prefers-color-scheme: dark)").matches;

function lerpHex(a,b,t){
  const p = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const A=p(a), B=p(b);
  return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function colorDe(seg, i, n){
  const r = RAMPAS[seg] || RAMPAS.tractores;
  const [c1,c2] = oscuro() ? r.dark : [r.claro, r.oscuro];
  return n<=1 ? c2 : lerpHex(c1, c2, i/(n-1));
}

const num = (v,d=1)=> v==null ? "—" :
  v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const uni = v => v==null ? "—" : (Number.isInteger(v) ? num(v,0) : num(v,1));
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls = v => v==null ? "flat" : (v>0.05 ? "up" : (v<-0.05 ? "down" : "flat"));
const sgn = (v,d=1) => v==null ? "—" : (v>0?"+":"")+num(v,d);
const flecha = v => v==null ? "" : (v>0.05 ? "▲" : (v<-0.05 ? "▼" : "■"));
const txtVar = (v,suf="%") => v==null ? "—" : (v>0?"+":"")+num(v,1)+suf;

const S = {
  clave:null, seg:"tractores",  col:null,
  segs:{tractores:true, cosechadoras:false},
  medidas:{industria:true, dealer:false},
  desde:null, hasta:null,
  apagadas:{},        /* seg|key -> true */
  foco:null,
  indicador:"retenciones",
  ov:{decretos:true, retenciones:true, tc:false},
};

/* ==================== tablas en crudo ==================== */
function tablaCruda(mes, seg, per){
  const t = ((mes.segmentos[seg]||{})[per]) || null;
  if(!t) return '<p class="nota">El informe de '+esc(mes.mes_es)+' no trae esta tabla.</p>';
  const n = t.columnas.length;
  const marca = i => t.columnas[i]===S.col ? " marca" : "";
  const th = t.etiquetas.map(function(e,i){
    return '<th class="'+(i===n-3?"sep-l":"")+marca(i)+'" data-col="'+esc(t.columnas[i])+'">'
      +esc(e)+'</th>'; }).join("");
  const tr = t.filas.map(function(f){
    return '<tr'+(f.tipo==="industria"?' class="ind"':"")+'><td class="cat">'+esc(f.nombre)+'</td>'
      + f.valores.map(function(v,i){
          return '<td class="'+(i===n-3?"sep-l":"")+marca(i)+'">'
            +esc(f.textos && f.textos[i] ? f.textos[i] : uni(v))+'</td>'; }).join("")
      +'</tr>'; }).join("");
  return '<div class="caja"><div class="scroll"><table><thead><tr><th class="cat">'+per+'</th>'
    +th+'</tr></thead><tbody>'+tr+'</tbody></table></div></div>';
}
function pintarTablas(){
  const mes = APP.meses[S.clave];
  document.getElementById("tablas").innerHTML =
    '<div class="tit-tabla">'+SEG_ES[S.seg]+' · FYTD</div>'+tablaCruda(mes,S.seg,"FYTD")
   +'<div class="tit-tabla">'+SEG_ES[S.seg]+' · LFYTD</div>'+tablaCruda(mes,S.seg,"LFYTD");
  // Resalta la columna que esta bajo el mouse en las dos tablas a la vez.
  // Es solo visual: el resaltado fijo sigue siendo el del click.
  const tablas = document.querySelectorAll("#tablas table");
  tablas.forEach(function(tb){
    tb.addEventListener("mouseover", function(ev){
      const celda = ev.target.closest("td,th");
      if(!celda || !celda.parentElement) return;
      const i = Array.prototype.indexOf.call(celda.parentElement.children, celda);
      if(i<=0){ pintarColumna(null); return; }
      pintarColumna(i);
    });
    tb.addEventListener("mouseleave", function(){ pintarColumna(null); });
  });
  function pintarColumna(i){
    tablas.forEach(function(tb){
      tb.querySelectorAll("tr").forEach(function(tr){
        Array.prototype.forEach.call(tr.children, function(c,k){
          c.classList.toggle("col-hover", i!==null && k===i);
        });
      });
    });
  }

  document.querySelectorAll("#tablas th[data-col]").forEach(function(th){
    th.onclick = function(){
      S.col = (S.col===th.dataset.col) ? null : th.dataset.col; pintarTablas(); };
  });
}

/* ==================== serie mensual ==================== */
function puntos(seg){ return ((APP.series[seg]||{}).puntos) || []; }
function ejeCompleto(){
  const m = new Map();
  ["tractores","cosechadoras"].forEach(function(seg){
    puntos(seg).forEach(function(p){ m.set(p.clave,p); }); });
  return Array.from(m.values()).sort(function(a,b){ return a.clave<b.clave?-1:1; });
}
function eje(){
  return ejeCompleto().filter(function(p){ return p.clave>=S.desde && p.clave<=S.hasta; });
}
function tipos(seg){ return ((APP.series[seg]||{}).categorias) || []; }
function valorDe(seg,key,clave,med){
  const p = puntos(seg).find(function(p){ return p.clave===clave; });
  if(!p) return null;
  const v = (p[med]||{})[key];
  return v===undefined ? null : v;
}
function segsActivos(){
  return ["tractores","cosechadoras"].filter(function(x){
    return S.segs[x] && puntos(x).length; });
}
function medidasActivas(){
  return ["industria","dealer"].filter(function(m){ return S.medidas[m]; });
}
const MED_ES = {industria:"Industria", dealer:"Cetomaq"};
let FOCO = null;   // lo setea dibujar(); lo usa la leyenda al pasar el mouse
const apagada = (seg,key)=> !!S.apagadas[seg+"|"+key];

function pasoLindo(bruto){
  const e = Math.pow(10, Math.floor(Math.log10(Math.max(bruto,1e-6))));
  const n = bruto/e;
  return Math.max((n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e, 1);
}

/* ==================== grafico ==================== */
function hayEventos(){ return !!(IND && IND.eventos && IND.eventos.length); }

function dibujar(){
  const E = eje(), cont = document.getElementById("chart-hold");
  const segs = segsActivos(), meds = medidasActivas();
  const nTipos = segs.reduce(function(n,sg){ return n + tipos(sg).length; }, 0);
  const nVis = segs.reduce(function(n,sg){
    return n + tipos(sg).filter(function(c){ return !apagada(sg,c.key); }).length; }, 0);

  document.getElementById("chart-tit").textContent =
    "Unidades vendidas por mes · " + segs.map(function(x){ return SEG_ES[x]; }).join(" y ")
    + " · " + meds.map(function(m){ return MED_ES[m]; }).join(" y ");
  document.getElementById("chart-sub").textContent =
    E.length ? (E[0].mes + " a " + E[E.length-1].mes + " · unidades por mes · " +
      nVis + " de " + nTipos + " tipos de máquina" +
      (meds.length>1 ? " · línea llena es industria, punteada es Cetomaq" : "") +
      (S.ov.retenciones && hayEventos() ? " · la cinta amarilla es la retención a la soja" : "") +
      (S.ov.tc ? " · la tira de abajo es el dólar oficial" : "")) : "";

  if(E.length<2){
    cont.innerHTML = '<p class="nota">Elegí un rango de al menos dos meses.</p>';
    pintarLeyenda(); return;
  }

  const hayEv = IND && IND.eventos && IND.eventos.length;
  const cinta = (S.ov.retenciones && hayEv) ? 24 : 0;   // alto de la cinta de retenciones
  const CLAVE_TC = (IND && IND.series && IND.series.oficial) ? "oficial" : "tc";
  const tira  = S.ov.tc && IND && IND.series && IND.series[CLAVE_TC] ? 48 : 0;
  const W=1000, mL=58, mR=64, mT=16, mB=30;
  const H = 300 + cinta + tira;
  const iw = W-mL-mR;
  const mT2 = mT + cinta;
  const ih = H - mT2 - mB - tira;
  const x = i => mL + i*iw/(E.length-1);

  let maxV=0, minV=0;
  // Una serie por cada combinacion tipo de maquina x medida. El color sigue al
  // tipo (rampa por potencia) y el trazo a la medida: llena industria,
  // punteada Cetomaq. Asi los dos ejes de eleccion no se pisan.
  const datos = [];
  segs.forEach(function(sg){
    const cats = tipos(sg);
    cats.forEach(function(c,idx){
      const off = apagada(sg,c.key);
      meds.forEach(function(med){
        const pts = E.map(function(e,i){
          const v = valorDe(sg,c.key,e.clave,med);
          if(!off && v!=null){ if(v>maxV) maxV=v; if(v<minV) minV=v; }
          return {i:i, v:v};
        });
        datos.push({id:sg+"|"+c.key+"|"+med, seg:sg, key:c.key, med:med,
                    label:c.label, color:colorDe(sg,idx,cats.length),
                    // el grosor tambien crece con la potencia: dos pistas
                    // ordenadas separan mejor los tonos vecinos que una sola
                    grosor: (1.3 + 1.3*(cats.length>1 ? idx/(cats.length-1) : 1)).toFixed(2),
                    punteada: med==="dealer" && meds.length>1,
                    off:off, pts:pts});
      });
    });
  });

  const paso = pasoLindo(Math.max(4,maxV*1.12)/5);
  const topN = paso*Math.max(1,Math.ceil(Math.max(4,maxV*1.02)/paso));
  const botN = minV<0 ? -paso*Math.ceil(Math.abs(minV*1.15)/paso) : 0;
  const y = v => mT2+ih-((v-botN)/(topN-botN))*ih;

  let grid="", etY="";
  for(let v=botN; v<=topN+1e-9; v+=paso){
    grid += '<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/>';
    etY += '<text x="'+(mL-9)+'" y="'+(y(v)+4)+'" text-anchor="end" fill="var(--ink-3)" font-size="11">'+v+'</text>';
  }

  // bandas suaves alternadas por anio fiscal: dan profundidad y ubican el ejercicio
  let bandas="", ini=0;
  E.forEach(function(e,i){
    const corta = (i===E.length-1) || E[i+1].fy!==e.fy;
    if(corta){
      const x0 = ini===0 ? mL : (x(ini)+x(ini-1))/2;
      const x1 = i===E.length-1 ? W-mR : (x(i)+x(i+1))/2;
      const par = (e.fy.charCodeAt(e.fy.length-1)) % 2 === 0;
      if(par) bandas += '<rect class="fy-banda" x="'+x0+'" y="'+mT2+'" width="'+(x1-x0)
        +'" height="'+ih+'" fill="var(--ink)" opacity=".025"/>';
      ini = i+1;
    }
  });

  let fy="", etX="";
  E.forEach(function(e,i){
    if(i>0 && e.fy!==E[i-1].fy){
      fy += '<line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+mT2+'" y2="'+(mT2+ih)+'" stroke="var(--line-2)" stroke-dasharray="3 3"/>'
          + '<text x="'+(x(i)+5)+'" y="'+(mT2+11)+'" fill="var(--ink-3)" font-size="10.5" font-weight="700">'+esc(e.fy)+'</text>';
    }
    const cada = E.length>14?2:1;
    if(i%cada===0 || i===E.length-1){
      const anc = i===0?"start":(i===E.length-1?"end":"middle");
      // pegadas al eje del grafico, no al fondo: con la tira del dolar
      // encendida el SVG crece y quedaban colgadas abajo, encima de la tira
      etX += '<text x="'+x(i)+'" y="'+(mT2+ih+18)+'" text-anchor="'+anc+'" fill="var(--ink-3)" font-size="10.5">'+esc(e.mes)+'</text>';
    }
  });

  const lineas = datos.filter(function(d){ return !d.off; }).map(function(d,orden){
    const tramos=[]; let act=[];
    d.pts.forEach(function(p){
      if(p.v==null){ if(act.length) tramos.push(act); act=[]; }
      else act.push(x(p.i)+","+y(p.v)); });
    if(act.length) tramos.push(act);
    return tramos.map(function(t){
      return t.length===1
        ? '<circle class="serie" data-k="'+esc(d.id)+'" cx="'+t[0].split(",")[0]+'" cy="'+t[0].split(",")[1]+'" r="3" fill="'+d.color+'"/>'
        : '<polyline class="serie'+(d.punteada?" punteada":"")+'" data-k="'+esc(d.id)+'" data-g="'+d.grosor+'" points="'+t.join(" ")+'" pathLength="1" style="--i:'+orden+'" fill="none" stroke="'+d.color+'" stroke-width="'+d.grosor+'" stroke-linejoin="round" stroke-linecap="round"/>';
    }).join("");
  }).join("");

  // ---- cinta de regimenes de retenciones, arriba del area de dibujo ----
  let cintaSVG = "";
  if(cinta){
    const cortes = [];
    (IND.eventos||[]).forEach(function(ev){
      if(ev.solo_evento || !ev.alicuotas || ev.alicuotas.soja==null) return;
      const i = E.findIndex(function(p){ return p.clave===ev.mes; });
      if(i>0) cortes.push({i:i, tasa:ev.alicuotas.soja});
    });
    // Dos decretos pueden caer en el mismo mes (jul-2025: el 439 sube y el 526
    // baja): manda el ultimo. Y un decreto puede no tocar la soja (423/2026),
    // asi que no corta la cinta aunque si aparezca su marca vertical.
    const limpios = [];
    cortes.forEach(function(c){
      if(limpios.length && limpios[limpios.length-1].i===c.i) limpios.pop();
      limpios.push(c);
    });
    let desde = 0, tasa = alicuotaSoja(E[0].clave), n = 0;
    const pinta = function(a, b, t){
      const x0 = a===0 ? mL : (x(a)+x(a-1))/2;
      const x1 = b>=E.length-1 ? W-mR : (x(b)+x(b+1))/2;
      cintaSVG += '<rect x="'+x0+'" y="'+mT+'" width="'+(x1-x0)+'" height="14" rx="2" '
        + 'fill="var(--amarillo)" opacity="'+(n%2 ? ".95" : ".62")+'"/>'
        + '<text class="cinta-ret" x="'+((x0+x1)/2)+'" y="'+(mT+10.5)
        + '" text-anchor="middle" fill="#4a3d00">'+num(t,0)+'%</text>';
      n++;
    };
    limpios.forEach(function(c){
      if(c.tasa===tasa) return;              // el decreto no movio la soja
      pinta(desde, c.i-1, tasa); desde=c.i; tasa=c.tasa;
    });
    pinta(desde, E.length-1, tasa);
  }

  // ---- lineas verticales de cada decreto ----
  let decSVG = "";
  if(S.ov.decretos && hayEv){
    (IND.eventos||[]).forEach(function(ev){
      const i = E.findIndex(function(p){ return p.clave===ev.mes; });
      if(i<0) return;
      // El <title> nativo tarda en aparecer y se corta: el globo va por JS,
      // con el mismo cuadro que usa el resto del grafico.
      decSVG += '<g class="marca-dec" data-ev="'+i+'" data-tit="'+esc(ev.titulo)+'" '
        + 'data-det="'+esc(ev.detalle)+'" data-fecha="'+esc(ev.fecha)+'">'
        + '<line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+mT2+'" y2="'+(mT2+ih)
        + '" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>'
        + '<circle cx="'+x(i)+'" cy="'+(mT2+5)+'" r="7" fill="transparent"/>'
        + '<circle cx="'+x(i)+'" cy="'+(mT2+5)+'" r="5" fill="var(--amarillo)" '
        + 'stroke="var(--ink-2)" stroke-width="1"/></g>';
    });
  }

  // ---- tira del tipo de cambio, abajo, con su propia escala ----
  let tcSVG = "";
  if(tira){
    const st = IND.series[CLAVE_TC] || {};
    const vs = E.map(function(e){ return st[e.clave]==null ? null : st[e.clave]; });
    const hay2 = vs.filter(function(v){ return v!=null; });
    if(hay2.length){
      const y0 = mT2+ih+mB+4, alto = tira-20;
      const mn = Math.min.apply(null,hay2), mx = Math.max.apply(null,hay2);
      const yy = function(v){ return y0+alto - (v-mn)/((mx-mn)||1)*alto; };
      let d="", ar="";
      vs.forEach(function(v,i){ if(v==null) return;
        d += !d ? "M"+x(i)+","+yy(v) : "L"+x(i)+","+yy(v); });
      if(d) ar = d+"L"+x(vs.length-1)+","+(y0+alto)+"L"+x(0)+","+(y0+alto)+"Z";
      tcSVG = '<path d="'+ar+'" fill="var(--jd)" opacity=".10"/>'
        + '<path d="'+d+'" fill="none" stroke="var(--jd)" stroke-width="1.8" '
        + 'stroke-linejoin="round"/>'
        + '<text class="tira-tc" x="'+(mL-9)+'" y="'+(y0+9)+'" text-anchor="end" '
        + 'fill="var(--ink-3)" font-weight="700">US$</text>'
        + '<text class="tira-tc" x="'+(mL-9)+'" y="'+(y0+alto)+'" text-anchor="end" '
        + 'fill="var(--ink-3)">'+num(mn,0)+'</text>'
        + '<text class="tira-tc" x="'+(W-mR+3)+'" y="'+(yy(vs[vs.length-1])+3)+'" '
        + 'fill="var(--jd)" font-weight="700">'+esc(E[E.length-1].mes)+' · '
        + num(vs[vs.length-1],0)+'</text>';
    }
  }

  cont.innerHTML =
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Unidades por mes y tipo de máquina">'
    + bandas + grid + fy + cintaSVG + tcSVG
    + '<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--line-2)"/>'
    + etY + etX
    + '<path id="area-foco" d="" fill="none" opacity="0"/>'
    + lineas + '<g id="marcas-foco"></g>'
    // apagar todas las categorias dejaba una grilla muda: que lo diga
    + (datos.some(function(z){ return !z.off; }) ? "" :
        '<text x="'+(W/2)+'" y="'+(mT2+ih/2-6)+'" text-anchor="middle" fill="var(--ink-2)" '
        + 'font-size="13" font-weight="600">No hay ningún tipo de máquina visible</text>'
        + '<text x="'+(W/2)+'" y="'+(mT2+ih/2+14)+'" text-anchor="middle" fill="var(--ink-3)" '
        + 'font-size="11.5">Usá «Mostrar todas» en la leyenda de abajo</text>') 
    + '<line id="cruz" x1="0" x2="0" y1="'+mT2+'" y2="'+(mT2+ih)+'" stroke="var(--ink-3)" stroke-dasharray="3 3" opacity="0"/>'
    + '<rect x="'+mL+'" y="'+mT2+'" width="'+iw+'" height="'+ih+'" fill="transparent" id="cap"/>'
    // Las marcas de decreto van al final, encima del rectangulo que captura el
    // mouse: si van antes, el rectangulo se come el hover y no se abren nunca.
    + decSVG
    + '</svg><div class="tip" id="tip"></div>';

  const svg=cont.querySelector("svg"), tip=cont.querySelector("#tip"), cruz=cont.querySelector("#cruz");
  const vivos = datos.filter(function(d){ return !d.off; });

  const area = cont.querySelector("#area-foco");
  const marcas = cont.querySelector("#marcas-foco");

  // k puede ser el id completo (seg|tipo|medida) o el prefijo seg|tipo, que es
  // lo unico que sabe la leyenda: en ese caso resalta las dos medidas.
  function pintarFoco(k){
    const calza = function(id){ return id===k || id.indexOf(k+"|")===0; };
    cont.querySelectorAll(".serie").forEach(function(el){
      const suyo = k!==null && calza(el.dataset.k);
      el.style.opacity = (k===null || suyo) ? "1" : ".16";
      el.setAttribute("stroke-width", suyo ? "3.4" : (el.dataset.g || "1.9"));
      el.classList.toggle("foco", suyo);
    });
    const hits = k==null ? [] : vivos.filter(function(s){ return calza(s.id); });
    const d = hits.length===1 ? hits[0] : null;
    if(!d){ area.setAttribute("opacity","0"); marcas.innerHTML=""; return; }
    // relleno bajo la linea en foco, por tramos (puede haber meses sin dato)
    let dd="", act=[];
    const cerrar = function(){
      if(act.length<2){ act=[]; return; }
      dd += "M"+act[0][0]+","+y(0)+"L"+act.map(function(p){return p[0]+","+p[1];}).join("L")
          + "L"+act[act.length-1][0]+","+y(0)+"Z";
      act=[];
    };
    d.pts.forEach(function(p){
      if(p.v==null) cerrar(); else act.push([x(p.i), y(p.v)]);
    });
    cerrar();
    area.setAttribute("d", dd);
    area.setAttribute("fill", d.color);
    area.setAttribute("opacity", dd ? ".13" : "0");
    marcas.innerHTML = d.pts.filter(function(p){ return p.v!=null; }).map(function(p){
      return '<circle cx="'+x(p.i)+'" cy="'+y(p.v)+'" r="3" fill="var(--sup)" stroke="'
        +d.color+'" stroke-width="2"/>'; }).join("");
  }

  cont.querySelector("#cap").addEventListener("mousemove", function(ev){
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)/r.width*W, py=(ev.clientY-r.top)/r.height*H;
    if(!r.width) return;   // contenedor oculto: la cuenta daria NaN
    let i=Math.round((px-mL)/(iw/(E.length-1)));
    i=Math.max(0,Math.min(E.length-1,i));
    if(!isFinite(i)) return;
    cruz.setAttribute("x1",x(i)); cruz.setAttribute("x2",x(i)); cruz.setAttribute("opacity","1");

    let foco=null, dmin=1e9;
    vivos.forEach(function(d){
      if(d.pts[i].v==null) return;
      const dist=Math.abs(y(d.pts[i].v)-py);
      if(dist<dmin){ dmin=dist; foco=d; }
    });
    if(dmin>26) foco=null;
    pintarFoco(foco?foco.id:null);

    const orden = vivos.filter(function(d){ return d.pts[i].v!=null; })
      .sort(function(a,b){ return b.pts[i].v-a.pts[i].v; });
    const top = orden.slice(0,7);
    if(foco && top.indexOf(foco)<0) top.unshift(foco);
    let filas = top.map(function(d){
      const marca = d.punteada
        ? 'background:repeating-linear-gradient(90deg,'+d.color+' 0 3px,transparent 3px 5px)'
        : 'background:'+d.color;
      const suf = (segs.length>1 ? " · "+(d.seg==="cosechadoras"?"cos.":"tract.") : "")
                + (meds.length>1 ? " · "+MED_ES[d.med] : "");
      return '<div class="r'+(foco===d?" foco":"")+'"><span><i class="pt" style="'+marca+'"></i>'
        +esc(d.label)+'<span class="mut">'+esc(suf)+'</span></span><b>'
        +uni(d.pts[i].v)+'</b></div>'; }).join("");
    if(orden.length>top.length)
      filas += '<div class="r"><span>+'+(orden.length-top.length)+' tipos más</span></div>';
    const tot = orden.reduce(function(s,d){ return s+d.pts[i].v; },0);
    filas += '<div class="r" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--line)">'
      +'<span>Total visible</span><b>'+uni(tot)+'</b></div>';
    tip.classList.remove("ancho");
    tip.innerHTML = '<h4>'+esc(E[i].mes)+' · '+esc(E[i].fy)+'</h4>'+filas;
    tip.style.opacity="1";
    tip.style.left = Math.min(Math.max(x(i)/W*r.width+14,0), r.width-tip.offsetWidth-4)+"px";
    tip.style.top = "4px";
  });
  cont.querySelector("#cap").addEventListener("mouseleave", function(){
    tip.style.opacity="0"; cruz.setAttribute("opacity","0"); pintarFoco(null); });
  FOCO = pintarFoco;

  // globo de los decretos
  cont.querySelectorAll(".marca-dec").forEach(function(g){
    g.addEventListener("mouseenter", function(){
      const r = svg.getBoundingClientRect();
      const i = +g.dataset.ev;
      const f = g.dataset.fecha;
      tip.classList.add("ancho");
      tip.innerHTML = '<h4>'+esc(f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(0,4))+'</h4>'
        + '<div class="ev-tit">'+esc(g.dataset.tit)+'</div>'
        + '<div class="ev-det">'+esc(g.dataset.det)+'</div>';
      tip.style.opacity = "1";
      tip.style.left = Math.min(Math.max(x(i)/W*r.width+14,0), r.width-tip.offsetWidth-4)+"px";
      tip.style.top = "4px";
    });
    g.addEventListener("mouseleave", function(){
      tip.style.opacity="0"; tip.classList.remove("ancho"); });
  });

  pintarLeyenda();
  dibujarFlot();
}

function pintarLeyenda(){
  const segs = segsActivos();
  let html = "";
  segs.forEach(function(sg){
    const cats = tipos(sg);
    if(segs.length>1) html += '<span class="ly-grupo">'+SEG_ES[sg]+'</span>';
    html += cats.map(function(c,i){
      return '<button class="ly" type="button" data-seg="'+sg+'" data-k="'+esc(c.key)+'" '
        +'aria-pressed="'+(!apagada(sg,c.key))+'" style="--c:'+colorDe(sg,i,cats.length)+'">'
        +'<i></i>'+esc(c.label)+'</button>'; }).join("");
  });
  html += '<span class="acciones"><button class="acc" data-todo="on">Mostrar todas</button>'
        + '<button class="acc" data-todo="off">Ocultar todas</button></span>';
  document.getElementById("leyenda").innerHTML = html;
  document.querySelectorAll("#leyenda [data-k]").forEach(function(b){
    const id = b.dataset.seg+"|"+b.dataset.k;
    b.onclick = function(){
      if(S.apagadas[id]) delete S.apagadas[id]; else S.apagadas[id]=true;
      dibujar();
    };
    // Con 14 tonos del mismo color la leyenda sola no alcanza: pasar el mouse
    // por la etiqueta aisla su linea en el grafico.
    b.onmouseenter = function(){ if(FOCO && !S.apagadas[id]) FOCO(id); };
    b.onmouseleave = function(){ if(FOCO) FOCO(null); };
  });
  document.querySelectorAll("#leyenda [data-todo]").forEach(function(b){
    b.onclick = function(){
      segsActivos().forEach(function(sg){
        tipos(sg).forEach(function(c){
          const id = sg+"|"+c.key;
          if(b.dataset.todo==="off") S.apagadas[id]=true; else delete S.apagadas[id];
        });
      });
      dibujar();
    };
  });
}

/* ============ fichas de cabecera ============
   Salen directo de las tablas del informe elegido: FYTD contra LFYTD, en AOR y
   en Pais, para la industria y para Cetomaq. Una ficha por segmento. */
function tabInf(mes, seg, per){
  return ((mes.segmentos[seg]||{})[per]) || null;
}
function valInf(t, tipo, col){
  if(!t) return null;
  const i = t.columnas.indexOf(col);
  const f = t.filas.find(function(x){ return x.tipo===tipo; });
  return (i<0 || !f) ? null : f.valores[i];
}
function varPc(act, ant){
  if(act==null || ant==null || ant===0) return null;
  return (act-ant)/ant*100;
}

/* Cotizacion del dia, aparte de la serie mensual: el grafico corta donde corta
   el ultimo informe, pero el dolar de hoy tiene que estar a la vista. */
function dolarHoy(){
  const d = IND && IND.dolar_hoy;
  if(!d || d.valor==null) return "";
  const f = d.fecha.slice(8,10)+"/"+d.fecha.slice(5,7);
  return '<span class="hoy">Dólar BNA <b>$'+num(d.valor,0)+'</b><i>'+esc(f)+'</i></span>';
}

function rangoFicha(){
  const todos = ejeCompleto();
  if(!todos.length) return null;
  if(!S.fDesde || !S.fHasta){
    const fy = todos[todos.length-1].fy;
    const delFy = todos.filter(function(p){ return p.fy===fy; });
    S.fDesde = (delFy[0] || todos[0]).clave;
    S.fHasta = todos[todos.length-1].clave;
  }
  return todos.filter(function(p){ return p.clave>=S.fDesde && p.clave<=S.fHasta; });
}
function unAnioAntes(clave){
  return (parseInt(clave.slice(0,4),10)-1) + "-" + clave.slice(5);
}
/* Suma del periodo, de la serie mensual: sirve igual para AOR y para Pais. */
function sumaPeriodo(seg, claves, med, col){
  let t = 0, hay = false;
  claves.forEach(function(c){
    const p = puntos(seg).find(function(x){ return x.clave===c; });
    if(!p) return;
    const v = (p[med]||{})[col];
    if(v!=null){ t += v; hay = true; }
  });
  return hay ? t : null;
}

function pintarFichas(){
  const cont = document.getElementById("fichas");
  const E = rangoFicha();
  if(!E || !E.length){ cont.innerHTML=""; return; }

  const seg = S.seg;
  const dealerNom = APP.meses[S.clave].dealer;
  const claves = E.map(function(p){ return p.clave; });
  const clavesAnt = claves.map(unAnioAntes);
  const todos = ejeCompleto().map(function(p){ return p.clave; });
  const hayAnt = clavesAnt.every(function(c){ return todos.indexOf(c)>=0; });

  const etAct = E[0].mes + " a " + E[E.length-1].mes;
  const etAnt = hayAnt
    ? ejeCompleto().find(function(p){ return p.clave===clavesAnt[0]; }).mes + " a "
      + ejeCompleto().find(function(p){ return p.clave===clavesAnt[clavesAnt.length-1]; }).mes
    : null;

  const linea = function(rot, hoy, antes, esShare){
    const v = esShare ? ((hoy!=null&&antes!=null) ? hoy-antes : null) : varPc(hoy, antes);
    return '<div class="linea">'
      + '<span class="rot">'+esc(rot)+'</span>'
      + '<span class="hoy">'+(esShare ? (hoy==null?"—":num(hoy,1)+"%") : uni(hoy))+'</span>'
      + '<span class="antes">'+(antes==null ? "sin dato anterior"
          : (esShare ? num(antes,1)+"%" : uni(antes)))+'</span>'
      + '<span class="delta '+cls(v)+'">'+flecha(v)+' '+txtVar(v, esShare?" pp":"%")+'</span>'
      + '</div>';
  };

  const ambito = function(col, et){
    const iA = sumaPeriodo(seg, claves, "industria", col);
    const dA = sumaPeriodo(seg, claves, "dealer", col);
    const iB = hayAnt ? sumaPeriodo(seg, clavesAnt, "industria", col) : null;
    const dB = hayAnt ? sumaPeriodo(seg, clavesAnt, "dealer", col) : null;
    const sA = (iA && dA!=null) ? dA/iA*100 : null;
    const sB = (iB && dB!=null) ? dB/iB*100 : null;
    return '<div class="ambito"><h4>'+esc(et)+'</h4>'
      + linea("Industria", iA, iB, false)
      + linea(dealerNom,   dA, dB, false)
      + linea("Market share", sA, sB, true)
      + '</div>';
  };

  const ops = function(sel){
    return ejeCompleto().map(function(p){
      return '<option value="'+p.clave+'"'+(p.clave===sel?" selected":"")+'>'+esc(p.mes)+'</option>';
    }).join("");
  };

  cont.innerHTML = '<div class="ficha '+(seg==="cosechadoras"?"cos":"")+'">'
    + '<div class="ficha-cab"><b>'+SEG_ES[seg]+'</b>'
      + '<span class="ficha-per">de <select id="f-desde">'+ops(S.fDesde)+'</select>'
      + ' a <select id="f-hasta">'+ops(S.fHasta)+'</select></span>'
      + '<span class="ficha-vs">'+esc(etAct)+(etAnt ? ' vs '+esc(etAnt) : ' · sin período anterior')+'</span>'
    + '</div>'
    + '<div class="ficha-cuerpo">'+ambito("AOR","AOR")+ambito("PAIS","País")+'</div>'
    + '</div>';

  const dd = document.getElementById("f-desde"), hh = document.getElementById("f-hasta");
  dd.onchange = function(){ S.fDesde = dd.value;
    if(S.fDesde > S.fHasta) S.fHasta = S.fDesde; pintarFichas(); };
  hh.onchange = function(){ S.fHasta = hh.value;
    if(S.fHasta < S.fDesde) S.fDesde = S.fHasta; pintarFichas(); };
}

/* ==================== contexto ==================== */
function alicuotaSoja(clave){
  if(!IND || !IND.eventos) return null;
  let v=33;
  IND.eventos.forEach(function(e){
    if(e.solo_evento || !e.alicuotas || e.alicuotas.soja==null) return;
    if((e.mes || e.fecha.slice(0,7)) <= clave) v = e.alicuotas.soja; });
  return v;
}
function comoSeMide(cat){
  if(cat.modo==="cierre")   return " · último valor de cada mes";
  if(cat.modo==="promedio") return " · promedio de cada mes";
  return "";
}

function catalogoInd(){
  if(!IND) return [];
  // 'mostrar' lo define indicadores.py; el resto de las series igual queda en el
  // JSON, asi volver a mostrar una es agregar su clave alla y nada mas.
  const lista = IND.mostrar || ["tc"];
  const out = lista.filter(function(k){ return k!=="retenciones"; })
    .filter(function(k){ return IND.series && IND.series[k]; })
    .map(function(k){ return {key:k,label:IND.meta[k].etiqueta,unidad:IND.meta[k].unidad,modo:IND.meta[k].modo}; });
  if(IND.eventos && IND.eventos.length)
    out.push({key:"retenciones",label:"Retenciones a la soja",unidad:"%"});
  return out;
}
function serieInd(key, E){
  return E.map(function(e){
    if(key==="retenciones") return alicuotaSoja(e.clave);
    const s = (IND && IND.series[key]) || {};
    return s[e.clave]==null ? null : s[e.clave];
  });
}

/* Ventana flotante: comparte el rango de meses del grafico de ventas, pero cada
   indicador lleva su propia escala. Nunca dos escalas en un mismo dibujo. */
function dibujarFlot(){
  const flot = document.getElementById("flot");
  if(!IND || !flot || flot.hidden) return;
  const E = eje();
  document.getElementById("flot-rango").textContent =
    E.length ? E[0].mes + " – " + E[E.length-1].mes : "";
  const cuerpo = document.getElementById("flot-cuerpo");
  if(E.length < 2){
    cuerpo.innerHTML = '<p class="nota">Elegí un rango de al menos dos meses.</p>'; return; }

  const cat = catalogoInd();
  const act = cat.find(function(c){ return c.key===S.indicador; }) || cat[0];
  if(!act){ cuerpo.innerHTML = '<p class="nota">Sin indicadores cargados.</p>'; return; }

  cuerpo.innerHTML = '<div class="flot-tit">'+esc(act.label)+'</div>'
    + '<div class="flot-uni">'+esc(act.unidad)+esc(comoSeMide(act))+'</div>'
    + masAlla(act, E)
    + '<div id="flot-grande"></div>'
    + '<div class="mini-grid" id="flot-minis"></div>'
    + '<p class="nota">Los puntos amarillos marcan cambios de derechos de exportación: '
    + 'pasá el mouse para ver el decreto. Fuente: '+esc(IND.fuente)+', bajado el '
    + esc(IND.bajado)+'.</p>';

  grafInd(document.getElementById("flot-grande"), serieInd(act.key,E), E, act, true);

  document.getElementById("flot-minis").innerHTML = cat.map(function(c){
    const v = serieInd(c.key,E).filter(function(x){ return x!=null; });
    const ult = v.length ? v[v.length-1] : null;
    return '<button class="mini" type="button" data-ind="'+c.key+'" aria-pressed="'
      +(c.key===act.key)+'"><span class="n">'+esc(c.label)+'</span>'
      +'<span class="v">'+(ult==null?"—":num(ult, ult>=1000?0:1))+'</span>'
      +'<span class="cuando">'+esc(E[E.length-1].mes)+'</span>'
      +'<span data-spark="'+c.key+'"></span></button>';
  }).join("");

  cat.forEach(function(c){
    const cc = document.querySelector('[data-spark="'+c.key+'"]');
    if(cc) chispa(cc, serieInd(c.key,E), c.key===act.key);
  });
  document.querySelectorAll("#flot-minis [data-ind]").forEach(function(b){
    b.onclick = function(){ S.indicador = b.dataset.ind; dibujarFlot(); };
  });
}

/* grafico grande de un indicador */
/* Aviso cuando la serie del indicador llega mas lejos que el ultimo informe
   TBM: si no, el valor del borde parece "atrasado" contra el diario de hoy. */
function masAlla(cat, E){
  if(cat.key==="retenciones" || !IND.series[cat.key]) return "";
  const s = IND.series[cat.key];
  const ms = Object.keys(s).sort();
  const finRango = E[E.length-1].clave;
  if(!ms.length || ms[ms.length-1] <= finRango) return "";
  const m = ms[ms.length-1];
  const COR = ["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const et = COR[+m.slice(5)] + " " + m.slice(2,4);
  return '<div class="mas-alla">El gráfico corta en '+esc(E[E.length-1].mes)
    + ', que es hasta donde llega el último informe TBM. La serie sigue: '
    + esc(et)+' cerró en <b>'+num(s[m], s[m]>=1000?0:1)+'</b>.</div>';
}

function grafInd(cont, vals, E, cat, conEventos){
  const hay = vals.filter(function(v){ return v!=null; });
  if(!hay.length){ cont.innerHTML = '<p class="nota">Sin datos en este rango.</p>'; return; }
  const W=500,H=160,mL=44,mR=12,mT=10,mB=20, iw=W-mL-mR, ih=H-mT-mB;
  const x = function(i){ return mL + i*iw/Math.max(E.length-1,1); };
  const min=Math.min.apply(null,hay), max=Math.max.apply(null,hay);
  const paso=pasoLindo((max-min||max||1)/3);
  const lo=Math.max(0,Math.floor(min/paso)*paso), hi=Math.ceil((max+paso*0.15)/paso)*paso;
  const y=function(v){ return mT+ih-(v-lo)/((hi-lo)||1)*ih; };

  let grid="",etY="";
  for(let v=lo; v<=hi+1e-9; v+=paso){
    grid += '<line x1="'+mL+'" x2="'+(W-mR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/>';
    etY += '<text x="'+(mL-7)+'" y="'+(y(v)+4)+'" text-anchor="end" fill="var(--ink-3)" '
      + 'font-size="9.5">'+num(v, v>=1000?0:(paso<1?1:0))+'</text>';
  }
  let etX="";
  E.forEach(function(e,i){
    const cada = Math.max(1, Math.ceil(E.length/6));
    if(i%cada===0 || i===E.length-1){
      const anc = i===0?"start":(i===E.length-1?"end":"middle");
      etX += '<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="'+anc+'" fill="var(--ink-3)" '
        + 'font-size="9.5">'+esc(e.mes)+'</text>';
    }
  });
  const escalon = cat.key==="retenciones";
  let d="", area="";
  vals.forEach(function(v,i){
    if(v==null) return;
    d += !d ? "M"+x(i)+","+y(v) : (escalon ? "H"+x(i)+"V"+y(v) : "L"+x(i)+","+y(v));
  });
  if(d) area = d + "L"+x(vals.length-1)+","+(mT+ih)+"L"+x(0)+","+(mT+ih)+"Z";

  let marcas="";
  if(conEventos) marcas = (IND.eventos||[]).map(function(ev){
    const i = E.findIndex(function(pp){ return pp.clave===ev.mes; });
    if(i<0) return "";
    return '<line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+mT+'" y2="'+(mT+ih)+'" '
      + 'stroke="var(--ink-3)" stroke-dasharray="2 3" opacity=".5"/>'
      + '<circle cx="'+x(i)+'" cy="'+(mT+ih)+'" r="3.4" fill="var(--amarillo)" '
      + 'stroke="var(--ink-2)" stroke-width="1.2"><title>'+esc(ev.titulo)+" — "
      + esc(ev.detalle)+'</title></circle>';
  }).join("");

  cont.innerHTML = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'
    + esc(cat.label)+'">'+grid+etY+etX+marcas
    + '<path d="'+area+'" fill="var(--jd)" opacity=".10"/>'
    + '<path d="'+d+'" fill="none" stroke="var(--jd)" stroke-width="2.2" '
    + 'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* sparkline del selector */
function chispa(cont, vals, activo){
  const hay = vals.filter(function(v){ return v!=null; });
  if(!hay.length){ cont.innerHTML=""; return; }
  const W=110,H=26,m=3;
  const min=Math.min.apply(null,hay), max=Math.max.apply(null,hay), rango=(max-min)||1;
  const x = function(i){ return m + i*(W-2*m)/Math.max(vals.length-1,1); };
  const y = function(v){ return H-m - (v-min)/rango*(H-2*m); };
  let d="";
  vals.forEach(function(v,i){ if(v==null) return;
    d += !d ? "M"+x(i)+","+y(v) : "L"+x(i)+","+y(v); });
  cont.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
    + '<path d="'+d+'" fill="none" stroke="'+(activo?"var(--jd)":"var(--ink-3)")
    + '" stroke-width="'+(activo?2:1.4)+'" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function armarFlot(){
  const flot=document.getElementById("flot"), cab=document.getElementById("flot-cab");
  const abrir=document.getElementById("abrir-ind");
  if(!IND){ abrir.style.display="none"; return; }
  abrir.onclick=function(){ flot.hidden=false; dibujarFlot(); };
  document.getElementById("flot-cerrar").onclick=function(){ flot.hidden=true; };
  document.addEventListener("keydown", function(ev){
    if(ev.key==="Escape") flot.hidden=true; });

  let ax=0, ay=0, arrastrando=false;
  cab.addEventListener("mousedown", function(ev){
    if(ev.target.tagName==="BUTTON") return;
    const r=flot.getBoundingClientRect();
    flot.style.left=r.left+"px"; flot.style.top=r.top+"px";
    flot.style.right="auto"; flot.style.bottom="auto";
    ax=ev.clientX-r.left; ay=ev.clientY-r.top;
    arrastrando=true; cab.classList.add("arrastrando");
    ev.preventDefault();
  });
  document.addEventListener("mousemove", function(ev){
    if(!arrastrando) return;
    const w=flot.offsetWidth, h=flot.offsetHeight;
    flot.style.left=Math.min(Math.max(ev.clientX-ax,4), window.innerWidth-w-4)+"px";
    flot.style.top =Math.min(Math.max(ev.clientY-ay,4), window.innerHeight-h-4)+"px";
  });
  document.addEventListener("mouseup", function(){
    arrastrando=false; cab.classList.remove("arrastrando"); });
}

/* ==================== controles ==================== */
function armarControles(){
  const todos = ejeCompleto();
  const ops = function(sel){ return todos.map(function(p){
    return '<option value="'+p.clave+'"'+(p.clave===sel?" selected":"")+'>'+esc(p.mes)+'</option>';
  }).join(""); };
  document.getElementById("ctrl").innerHTML =
     '<div class="campo"><span>Segmento</span><div class="seg" id="segG">'
    +'<button type="button" data-s="tractores" aria-pressed="true">Tractores</button>'
    +'<button type="button" data-s="cosechadoras" aria-pressed="false">Cosechadoras</button></div></div>'
    +'<div class="campo"><span>Medida</span><div class="seg" id="medida">'
    +'<button type="button" data-m="industria" aria-pressed="true">Industria</button>'
    +'<button type="button" data-m="dealer" aria-pressed="false">Cetomaq</button></div></div>'
    +'<div class="campo"><span>Desde</span><select id="desde">'+ops(S.desde)+'</select></div>'
    +'<div class="campo"><span>Hasta</span><select id="hasta">'+ops(S.hasta)+'</select></div>';

  // Los dos grupos aceptan varias opciones a la vez; siempre queda una prendida.
  function alterna(sel, estado, clave){
    document.querySelectorAll(sel).forEach(function(b){
      b.onclick=function(){
        const k = b.dataset[clave];
        const prendidas = Object.keys(estado).filter(function(x){ return estado[x]; });
        if(estado[k] && prendidas.length===1) return;   // no dejar el grafico vacio
        estado[k] = !estado[k];
        b.setAttribute("aria-pressed", String(estado[k]));
        dibujar();
      };
    });
  }
  alterna("#segG button", S.segs, "s");
  alterna("#medida button", S.medidas, "m");
  document.querySelectorAll("#ov-chips [data-ov]").forEach(function(b){
    b.onclick=function(){
      S.ov[b.dataset.ov] = !S.ov[b.dataset.ov];
      b.setAttribute("aria-pressed", String(S.ov[b.dataset.ov]));
      dibujar();
    };
  });
  const dd=document.getElementById("desde"), hh=document.getElementById("hasta");
  dd.onchange=function(){ S.desde=dd.value;
    if(S.desde>S.hasta){ S.hasta=S.desde; hh.value=S.hasta; } dibujar(); };
  hh.onchange=function(){ S.hasta=hh.value;
    if(S.hasta<S.desde){ S.desde=S.hasta; dd.value=S.desde; } dibujar(); };
}

/* ==================== arranque ==================== */
function render(){
  const mes = APP.meses[S.clave];
  document.getElementById("sub").innerHTML =
    esc(mes.dealer)+' · '+esc(mes.mes_es)+' <span class="fy">'+esc(mes.fy)+'</span>'
    + dolarHoy();
  document.title = "TBM "+mes.dealer+" — "+mes.mes_es;
  pintarFichas();
  pintarTablas();
  document.getElementById("pie").innerHTML =
    'Fuente: '+esc(mes.archivo)+' · John Deere TBM Dealer Analysis'
    +(mes.fuente?' · '+esc(mes.fuente):"")
    +' · '+Object.keys(APP.meses).length+' informes cargados · generado '+esc(APP.generado);
}
/* Aparicion escalonada de los bloques al entrar en pantalla. Si el navegador
   no soporta IntersectionObserver, quedan visibles y listo. */
function armarRevelado(){
  if(!("IntersectionObserver" in window)) return;   // sin efecto, pero se ve todo
  const obs = new IntersectionObserver(function(entradas){
    entradas.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.style.animationDelay = "0ms";
      e.target.classList.add("entra");
      obs.unobserve(e.target);
    });
  }, {rootMargin:"0px 0px -8% 0px", threshold:0.04});
  document.querySelectorAll(".fichas, section").forEach(function(b,i){
    b.style.animationDelay = (i*70)+"ms";
    obs.observe(b);
  });
}

function init(){
  if(!APP || !APP.meses || !Object.keys(APP.meses).length){
    document.body.innerHTML="<p style='padding:24px'>No hay datos. Ejecutá <code>python procesar_tbm.py</code>.</p>";
    return;
  }
  const claves=Object.keys(APP.meses).sort();
  S.clave=claves[claves.length-1];
  const todos=ejeCompleto();
  S.hasta = todos.length ? todos[todos.length-1].clave : null;
  // Arranca en el año fiscal en curso: es el tramo que tiene su equivalente del
  // año anterior, así las fichas muestran variación desde el primer momento.
  const fyAct = todos.length ? todos[todos.length-1].fy : null;
  const delFy = todos.filter(function(p){ return p.fy===fyAct; });
  S.desde = delFy.length ? delFy[0].clave : (todos.length ? todos[0].clave : null);

  const sel=document.getElementById("mes");
  sel.innerHTML=claves.slice().reverse().map(function(c){
    return '<option value="'+c+'">'+esc(APP.meses[c].mes_es)+'</option>'; }).join("");
  sel.onchange=function(){ S.clave=sel.value; render(); };

  document.querySelectorAll("#segmento button").forEach(function(b){
    b.onclick=function(){ S.seg=b.dataset.seg; S.col=null;
      document.querySelectorAll("#segmento button").forEach(function(o){
        o.setAttribute("aria-pressed", String(o===b)); });
      pintarFichas(); pintarTablas(); }; });

  if(APP.avisos && APP.avisos.length)
    document.getElementById("avisos").innerHTML=
      '<div class="avisos"><b>Avisos del procesamiento</b><br>'+APP.avisos.map(esc).join("<br>")+'</div>';

  armarControles();
  armarFlot();
  render();
  dibujar();
  armarRevelado();
  if(window.matchMedia)
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", dibujar);
}
init();
</script>
